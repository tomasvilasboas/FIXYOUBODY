<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FIX YOU BODY</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      background-color: #111;
      color: #fff;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    header h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: 28px;
      color: #b19a4f;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      align-items: center;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border: 2px solid transparent;
      border-radius: 20px;
      transition: 0.3s ease;
    }

    .nav-links li a:hover {
      border-color: #b19a4f;
      background-color: #b19a4f;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: white;
    }

    .hero {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('fotoestudio.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px 20px;
    }

    .hero h2 {
      font-family: 'Bebas Neue', cursive;
      font-size: 56px;
      color: #b19a4f;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      max-width: 700px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .hero a.button {
      background-color: #b19a4f;
      color: white;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .hero a.button:hover {
      background-color: #a78f45;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      font-size: 14px;
      color: #888;
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .nav-links {
        position: absolute;
        top: 70px;
        right: 20px;
        background-color: rgba(0, 0, 0, 0.9);
        flex-direction: column;
        width: 200px;
        padding: 20px;
        border-radius: 10px;
        display: none;
      }

      .nav-links.active {
        display: flex;
      }

      .hero h2 {
        font-size: 36px;
      }

      .hero p {
        font-size: 16px;
        padding: 0 10px;
      }

      .hero a.button {
        padding: 12px 24px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header>
    <h1>FIX YOU BODY</h1>
    <nav>
      <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="informacoes.html">Informações</a></li>
        <li><a href="transformacoes.html">Transformações</a></li>
        <li><a href="indexarea.htm">Log In</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h2>FIX YOU BODY Private Studio</h2>
    <p>Espaço exclusivo, treinos personalizados, foco nos teus objetivos. Descobre a tua melhor versão num ambiente privado e profissional.</p>
    <a href="indexcomocontactar.html" class="button">Agende a sua Sessão</a>
  </section>

  <!-- FOOTER -->
  <footer>
    &copy; 2025 FIX YOU BODY. Todos os direitos reservados.
  </footer>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('navLinks');
      nav.classList.toggle('active');
    }
  </script>
</body>
</html>
