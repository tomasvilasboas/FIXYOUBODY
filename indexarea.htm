<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Área Reservada</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      background-color: #f1f1f1;
      color: #333;
      margin-top: 40px;
    }

    /* Cabeçalho com estilo fixo */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 40px; /* Mantém o cabeçalho com o mesmo padding */
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
      height: 80px; /* Define uma altura fixa para o cabeçalho */
    }

    header h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: 32px;
      color: #b19a4f;
      letter-spacing: 2px;
    }

    nav {
      position: relative;
    }

    /* Botão menu hamburguer */
    .menu-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      gap: 5px;
      z-index: 20;
    }

    .menu-toggle span {
      width: 25px;
      height: 3px;
      background: #b19a4f;
      border-radius: 2px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border: 2px solid transparent;
      border-radius: 20px;
      transition: 0.3s ease;
    }

    nav ul li a:hover {
      border-color: #b19a4f;
      background-color: #b19a4f;
    }

    /* Estilo do título de login */
    h2 {
      text-align: center;
      font-family: 'Bebas Neue', cursive;
      font-size: 40px;
      color: #b19a4f;
      margin-top: 120px;
    }

    /* Formulário de login */
    .form-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 350px;
      margin: 40px auto;
    }

    table {
      width: 100%;
      margin-bottom: 20px;
    }

    td {
      padding: 12px;
      font-weight: bold;
      text-align: left;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background-color: #f7f7f7;
      color: #333;
      font-size: 16px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      transition: 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #b19a4f;
      box-shadow: 0px 4px 10px rgba(177, 154, 79, 0.6);
    }

    input[type="submit"] {
      background-color: #b19a4f;
      color: white;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      width: 100%;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #8d7b47;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      font-size: 14px;
      color: #888;
      margin-top: 420px; /* Espaço extra entre conteúdo e rodapé */
    }

    .titulo-reservado {
      color: #000;
      font-family: 'Bebas Neue', cursive;
      font-size: 40px;
      margin-top: 150px;
      text-align: center;
    }

    .no-style-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .no-style-link:hover,
    .no-style-link:visited,
    .no-style-link:active {
      color: inherit;
      text-decoration: none;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      header {
        padding: 20px 20px; /* Mantém o padding em dispositivos móveis */
      }

      /* Exibir botão hamburguer */
      .menu-toggle {
        display: flex;
        right: 10px;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
        background-color: rgba(0,0,0,0.9);
        padding: 15px;
        border-radius: 10px;
        position: absolute;
        top: 60px;
        right: 0;
        display: none;
        width: 200px;
      }

      nav ul.active {
        display: flex;
      }

      h2 {
        color: #000;
        font-family: 'Bebas Neue', cursive;
        font-size: 40px;
        margin-top: 150px;
        text-align: center;
      }

      .form-container {
        width: 100%;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Cabeçalho com estilo fixo -->
  <header>
    <h1><a href="index.html" class="no-style-link">FIX YOU BODY</a></h1>
    <nav>
      <div class="menu-toggle" id="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul id="menu">
        <li><a href="informacoes.html">Informações</a></li>
        <li><a href="transformacoes.html">Transformações</a></li>
        <li><a href="indexarea.htm">Log In</a></li>
      </ul>
    </nav>
  </header>

  <!-- Título da página de login -->
  <h2 class="titulo-reservado">Log In</h2>

  <!-- Formulário de login -->
  <div class="form-container">
    <form action="login.php" method="post">
      <table>
        <tr>
          <td>Login</td>
          <td><input type="text" name="login" required></td>
        </tr>
        <tr>
          <td>Senha</td>
          <td><input type="password" name="senha" required></td>
        </tr>
        <tr>
          <td colspan="2" style="text-align: center;">
            <input type="submit" value="Entrar">
          </td>
        </tr>
      </table>
    </form>
  </div>

  <footer>
    &copy; 2025 FIX YOU BODY. Todos os direitos reservados.
  </footer>

  <script>
    const toggleButton = document.getElementById('menu-toggle');
    const menu = document.getElementById('menu');

    toggleButton.addEventListener('click', () => {
      menu.classList.toggle('active');
    });
  </script>

</body>
</html>
