  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      background-color: #f1f1f1;
      color: #333;
      overflow-x: hidden;
      margin: 0;
      display: flex;
      flex-direction: column;
      padding-top: 100px; /* espaço para header fixo */
    }

    /* Cabeçalho fixo */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      height: 80px;
    }

    header h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: 32px;
      color: #b19a4f;
      letter-spacing: 2px;
    }

    header h1 a {
      text-decoration: none;
      color: inherit;
    }

    nav {
      position: relative;
    }

    /* Menu hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 21px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 20;
      position: absolute;
      right: 20px;
      top: 25px;
      padding: 0;
    }

    .hamburger div {
      width: 100%;
      height: 3px;
      background-color: #b19a4f;
      transition: all 0.3s ease;
    }

    .hamburger.active div:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .hamburger.active div:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active div:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border: 2px solid transparent;
      transition: 0.3s ease;
    }

    nav ul li a:hover {
      border-color: #b19a4f;
      background-color: #b19a4f;
    }

    /* Estilo para o conteúdo principal */
    #main {
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 100px; /* para o rodapé */
    }

    h2 {
      font-family: 'Bebas Neue', cursive;
      font-size: 40px;
      color: #b19a4f;
      margin-bottom: 40px;
    }

    .form-container {
      background-color: #fff;
      padding: 30px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 15px; /* Borda arredondada para o container */
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      background-color: #f7f7f7;
      color: #333;
      font-size: 16px;
      transition: 0.3s ease;
      margin-bottom: 15px;
      border-radius: 8px; /* Borda arredondada para os inputs */
    }

    input:focus, button:focus, select:focus {
      border-color: #b19a4f;
      box-shadow: 0px 4px 10px rgba(177, 154, 79, 0.6);
      outline: none; /* Remove o outline padrão e mantém apenas o box-shadow */
    }

    button {
      background-color: #b19a4f;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
      border-radius: 8px; /* Borda arredondada para o botão */
    }

    button:hover {
      background-color: #8d7b47;
    }

    /* Rodapé */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      font-size: 14px;
      color: #888;
      width: 100%;
      margin-top: auto;
    }

    .no-style-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .no-style-link:hover,
    .no-style-link:visited,
    .no-style-link:active {
      color: inherit;
      text-decoration: none;
    }

    /* Responsividade menu */
    @media (max-width: 768px) {
      header {
        padding: 20px 20px;
      }

      /* Mostrar hamburger */
      .hamburger {
        display: flex;
      }

      nav ul {
        flex-direction: column;
        position: fixed;
        top: 80px;
        right: 0;
        background: rgba(0, 0, 0, 0.95);
        width: 220px;
        height: 100%;
        padding-top: 20px;
        transform: translateX(100%);
        transition: transform 0.3s ease-in-out;
      }

      nav ul.show {
        transform: translateX(0);
      }

      .form-container {
        width: 95%;
        padding: 20px;
      }

      h2 {
        font-size: 30px;
      }
    }
  </style>
</head>

  <script>
    // Menu hamburguer
    const hamburger = document.getElementById('hamburger');
    const menuPrincipal = document.getElementById('menu-principal');
    
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      menuPrincipal.classList.toggle('show');
    });
  </script>
